<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop View</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #eeeeee;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .home-button {
            display: inline-block;
            padding: 10px 25px;
            margin-bottom: 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .home-button:hover {
            opacity: 0.8;
        }

        iframe {
            width: 100%;
            max-width: 1440px;
            height: 800px;
            border: 2px solid #333;
            background: white;
        }
    </style>
</head>

<body>

    <a href="../index.html" class="home-button">Home</a>

    <h1>Desktop View</h1>

    <iframe src="../index.html" title="Desktop Home Page"></iframe>

</body>
</html>
